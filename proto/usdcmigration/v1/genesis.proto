syntax = "proto3";
package usdcmigration.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "usdcmigration/v1/params.proto";

option go_package = "github.com/giansalex/usdc-migration/v10/x/usdcmigration/types";

// GenesisState defines the usdcmigration module's genesis state.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated ReturnedTotal returned_totals = 2 [(gogoproto.nullable) = false];
  repeated PendingReturn pending_returns = 3 [(gogoproto.nullable) = false];
}

// ReturnedTotal is the amount of voucher sent back to Noble over a channel
// that has not been refunded (error ack or timeout).
message ReturnedTotal {
  string channel_id = 1;
  string amount = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// PendingReturn is a return packet sent by MsgReturnToNoble that has not been
// acknowledged or timed out yet. Its amount is part of the channel's returned
// total and is released if Noble answers with an error ack or it times out.
message PendingReturn {
  string channel_id = 1;
  uint64 sequence = 2;
  string amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}
