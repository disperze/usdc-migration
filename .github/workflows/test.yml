name: test

on:
  push:
    branches: [master, "release/**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.9"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
      - run: buf lint
        working-directory: proto
